name: Validate and publish Maclock release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set validation version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must be vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
          else
            version="0.0.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/control-panel/package-lock.json

      - name: Build web control panel
        working-directory: web/control-panel
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Prepare Mini vMac source
        run: bash ./prepare.sh

      - name: Build rollback-enabled firmware
        env:
          MACLOCK_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: pio run -e lolin_s3

      - name: Package and validate release assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/package_release.py \
            --version "$RELEASE_VERSION" \
            --output "dist/release/v$RELEASE_VERSION"
          test ! -e data/downloaded
          ! git ls-files data | grep -E '^data/downloaded(/|$)'

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maclock-release-v${{ steps.version.outputs.version }}
          path: dist/release/v${{ steps.version.outputs.version }}/
          if-no-files-found: error

  publish-release:
    if: github.ref_type == 'tag'
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@v4
        with:
          name: maclock-release-v${{ needs.validate-release.outputs.version }}
          path: dist/release/v${{ needs.validate-release.outputs.version }}

      - name: Publish stable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Maclock ${{ needs.validate-release.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/release/v${{ needs.validate-release.outputs.version }}/maclock-lolin-s3-firmware.bin
            dist/release/v${{ needs.validate-release.outputs.version }}/maclock-lolin-s3-update.json
            dist/release/v${{ needs.validate-release.outputs.version }}/maclock-lolin-s3-assets.zip
            dist/release/v${{ needs.validate-release.outputs.version }}/SHA256SUMS.txt
