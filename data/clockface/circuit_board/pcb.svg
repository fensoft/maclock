<svg xmlns="http://www.w3.org/2000/svg" width="304" height="224" viewBox="0 0 304 224" role="img" aria-label="Top-down realistic PCB frame with empty center for text">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164f3b"/>
      <stop offset="0.52" stop-color="#0f3f31"/>
      <stop offset="1" stop-color="#0a3228"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8d76a"/>
      <stop offset="0.45" stop-color="#d9a92e"/>
      <stop offset="1" stop-color="#9d6f12"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7dde0"/>
      <stop offset="0.45" stop-color="#899399"/>
      <stop offset="1" stop-color="#495158"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="microvias" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.15" fill="#c79b37" opacity="0.34"/>
    </pattern>
  </defs>

  <!-- PCB substrate -->
  <path d="M18 6 H286 Q298 6 298 18 V206 Q298 218 286 218 H18 Q6 218 6 206 V18 Q6 6 18 6 Z" fill="url(#board)" stroke="#071f19" stroke-width="3" filter="url(#shadow)"/>
  <path d="M20 12 H284 Q292 12 292 20 V204 Q292 212 284 212 H20 Q12 212 12 204 V20 Q12 12 20 12 Z" fill="none" stroke="#2b715a" stroke-width="1" opacity="0.55"/>
  <path d="M18 6 H286 Q298 6 298 18 V206 Q298 218 286 218 H18 Q6 218 6 206 V18 Q6 6 18 6 Z" fill="url(#microvias)" opacity="0.65"/>

  <!-- Mounting holes -->
  <g>
    <g transform="translate(24 24)"><circle r="8.5" fill="#08251d" stroke="#c7a445" stroke-width="2"/><circle r="4.4" fill="#0a0f10" stroke="#737f83" stroke-width="1"/></g>
    <g transform="translate(280 24)"><circle r="8.5" fill="#08251d" stroke="#c7a445" stroke-width="2"/><circle r="4.4" fill="#0a0f10" stroke="#737f83" stroke-width="1"/></g>
    <g transform="translate(24 200)"><circle r="8.5" fill="#08251d" stroke="#c7a445" stroke-width="2"/><circle r="4.4" fill="#0a0f10" stroke="#737f83" stroke-width="1"/></g>
    <g transform="translate(280 200)"><circle r="8.5" fill="#08251d" stroke="#c7a445" stroke-width="2"/><circle r="4.4" fill="#0a0f10" stroke="#737f83" stroke-width="1"/></g>
  </g>

  <!-- Copper routing under solder mask -->
  <g fill="none" stroke="#7fbf8d" stroke-linecap="round" stroke-linejoin="round" opacity="0.36">
    <path d="M36 40 H72 L84 52 H108" stroke-width="2.1"/>
    <path d="M36 47 H64 L78 61 H108" stroke-width="1.4"/>
    <path d="M42 56 H68 L79 67 H108" stroke-width="1.2"/>
    <path d="M197 48 H226 L239 35 H270" stroke-width="1.6"/>
    <path d="M196 57 H236 L248 45 H274" stroke-width="2.0"/>
    <path d="M197 67 H220 L235 82 H272" stroke-width="1.4"/>
    <path d="M38 164 H72 L86 150 H108" stroke-width="1.5"/>
    <path d="M40 176 H68 L82 162 H108" stroke-width="2.0"/>
    <path d="M43 187 H77 L93 171 H108" stroke-width="1.3"/>
    <path d="M196 153 H226 L240 167 H273" stroke-width="1.5"/>
    <path d="M196 164 H219 L237 182 H272" stroke-width="2.1"/>
    <path d="M196 176 H228 L242 190 H269" stroke-width="1.2"/>
    <path d="M67 31 V46 L76 55" stroke-width="1.2"/>
    <path d="M235 31 V45 L225 55" stroke-width="1.2"/>
    <path d="M69 193 V181 L83 167" stroke-width="1.2"/>
    <path d="M238 193 V180 L224 166" stroke-width="1.2"/>
  </g>

  <!-- Central text keep-out: blank inside -->
  <rect x="83" y="58" width="138" height="108" rx="8" fill="#0b3429" stroke="#8ec5aa" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.82"/>
  <path d="M91 58 h22 M83 66 v18 M213 58 h-22 M221 66 v18 M83 158 v-18 M91 166 h22 M221 158 v-18 M213 166 h-22" stroke="#dfece6" stroke-width="1.15" opacity="0.5" fill="none"/>

  <!-- Gold edge fingers / connector pads -->
  <g fill="url(#gold)" stroke="#6d4a0b" stroke-width="0.6">
    <rect x="48" y="12" width="11" height="14" rx="1"/><rect x="63" y="12" width="11" height="14" rx="1"/><rect x="78" y="12" width="11" height="14" rx="1"/><rect x="93" y="12" width="11" height="14" rx="1"/>
    <rect x="200" y="12" width="11" height="14" rx="1"/><rect x="215" y="12" width="11" height="14" rx="1"/><rect x="230" y="12" width="11" height="14" rx="1"/><rect x="245" y="12" width="11" height="14" rx="1"/>
    <rect x="48" y="198" width="11" height="14" rx="1"/><rect x="63" y="198" width="11" height="14" rx="1"/><rect x="78" y="198" width="11" height="14" rx="1"/><rect x="93" y="198" width="11" height="14" rx="1"/>
    <rect x="200" y="198" width="11" height="14" rx="1"/><rect x="215" y="198" width="11" height="14" rx="1"/><rect x="230" y="198" width="11" height="14" rx="1"/><rect x="245" y="198" width="11" height="14" rx="1"/>
  </g>

  <!-- QFN / IC footprints -->
  <g filter="url(#shadow)">
    <g transform="translate(54 86)">
      <rect x="0" y="0" width="26" height="30" rx="2.5" fill="#15191b" stroke="#5a666a" stroke-width="1"/>
      <circle cx="5" cy="5" r="1.3" fill="#a8b0b3"/>
      <g fill="#b8a66a">
        <rect x="-4" y="5" width="4" height="3"/><rect x="-4" y="11" width="4" height="3"/><rect x="-4" y="17" width="4" height="3"/><rect x="-4" y="23" width="4" height="3"/>
        <rect x="26" y="5" width="4" height="3"/><rect x="26" y="11" width="4" height="3"/><rect x="26" y="17" width="4" height="3"/><rect x="26" y="23" width="4" height="3"/>
      </g>
    </g>
    <g transform="translate(224 91)">
      <rect x="0" y="0" width="28" height="28" rx="2.5" fill="#171b1c" stroke="#5a666a" stroke-width="1"/>
      <circle cx="5" cy="5" r="1.3" fill="#a8b0b3"/>
      <g fill="#b8a66a">
        <rect x="5" y="-4" width="3" height="4"/><rect x="11" y="-4" width="3" height="4"/><rect x="17" y="-4" width="3" height="4"/><rect x="23" y="-4" width="3" height="4"/>
        <rect x="5" y="28" width="3" height="4"/><rect x="11" y="28" width="3" height="4"/><rect x="17" y="28" width="3" height="4"/><rect x="23" y="28" width="3" height="4"/>
      </g>
    </g>
  </g>

  <!-- SMD resistor/capacitor arrays -->
  <g stroke="#0b0e0f" stroke-width="0.5">
    <g transform="translate(42 130)">
      <g><rect x="0" y="0" width="14" height="6" rx="1" fill="#b2a88f"/><rect x="0" y="0" width="3" height="6" fill="#cfc4a8"/><rect x="11" y="0" width="3" height="6" fill="#cfc4a8"/></g>
      <g transform="translate(0 12)"><rect x="0" y="0" width="14" height="6" rx="1" fill="#50585b"/><rect x="0" y="0" width="3" height="6" fill="#c7b06c"/><rect x="11" y="0" width="3" height="6" fill="#c7b06c"/></g>
      <g transform="translate(0 24)"><rect x="0" y="0" width="14" height="6" rx="1" fill="#c0b49c"/><rect x="0" y="0" width="3" height="6" fill="#d6c9aa"/><rect x="11" y="0" width="3" height="6" fill="#d6c9aa"/></g>
    </g>
    <g transform="translate(248 132)">
      <g><rect x="0" y="0" width="14" height="6" rx="1" fill="#50585b"/><rect x="0" y="0" width="3" height="6" fill="#c7b06c"/><rect x="11" y="0" width="3" height="6" fill="#c7b06c"/></g>
      <g transform="translate(0 12)"><rect x="0" y="0" width="14" height="6" rx="1" fill="#b2a88f"/><rect x="0" y="0" width="3" height="6" fill="#cfc4a8"/><rect x="11" y="0" width="3" height="6" fill="#cfc4a8"/></g>
      <g transform="translate(0 24)"><rect x="0" y="0" width="14" height="6" rx="1" fill="#50585b"/><rect x="0" y="0" width="3" height="6" fill="#c7b06c"/><rect x="11" y="0" width="3" height="6" fill="#c7b06c"/></g>
    </g>
  </g>

  <!-- Inductors / power components -->
  <g filter="url(#shadow)">
    <rect x="36" y="62" width="15" height="15" rx="2" fill="#303638" stroke="#7e8a8e" stroke-width="1"/>
    <rect x="255" y="58" width="16" height="16" rx="2" fill="#303638" stroke="#7e8a8e" stroke-width="1"/>
    <rect x="32" y="170" width="17" height="17" rx="2" fill="#303638" stroke="#7e8a8e" stroke-width="1"/>
    <rect x="258" y="174" width="15" height="15" rx="2" fill="#303638" stroke="#7e8a8e" stroke-width="1"/>
  </g>

  <!-- Small ceramic caps -->
  <g fill="#d6c8a8" stroke="#8c8069" stroke-width="0.45">
    <rect x="61" y="66" width="8" height="4" rx="0.8"/><rect x="70" y="73" width="8" height="4" rx="0.8"/><rect x="232" y="67" width="8" height="4" rx="0.8"/>
    <rect x="66" y="160" width="8" height="4" rx="0.8"/><rect x="231" y="156" width="8" height="4" rx="0.8"/><rect x="240" y="163" width="8" height="4" rx="0.8"/>
  </g>

  <!-- Through-hole / plated vias around routes -->
  <g>
    <g fill="#c99b32" stroke="#765417" stroke-width="0.6">
      <circle cx="74" cy="47" r="3.2"/><circle cx="87" cy="54" r="3.2"/><circle cx="221" cy="48" r="3.2"/><circle cx="237" cy="57" r="3.2"/>
      <circle cx="72" cy="176" r="3.2"/><circle cx="88" cy="164" r="3.2"/><circle cx="222" cy="166" r="3.2"/><circle cx="239" cy="181" r="3.2"/>
      <circle cx="42" cy="103" r="3.2"/><circle cx="266" cy="106" r="3.2"/>
    </g>
    <g fill="#0a1915">
      <circle cx="74" cy="47" r="1.25"/><circle cx="87" cy="54" r="1.25"/><circle cx="221" cy="48" r="1.25"/><circle cx="237" cy="57" r="1.25"/>
      <circle cx="72" cy="176" r="1.25"/><circle cx="88" cy="164" r="1.25"/><circle cx="222" cy="166" r="1.25"/><circle cx="239" cy="181" r="1.25"/>
      <circle cx="42" cy="103" r="1.25"/><circle cx="266" cy="106" r="1.25"/>
    </g>
  </g>

  <!-- Header connector -->
  <g transform="translate(118 30)">
    <rect x="0" y="0" width="68" height="15" rx="2" fill="#171b1c" stroke="#475054" stroke-width="1"/>
    <g fill="url(#gold)">
      <circle cx="8" cy="7.5" r="3"/><circle cx="18" cy="7.5" r="3"/><circle cx="28" cy="7.5" r="3"/><circle cx="38" cy="7.5" r="3"/><circle cx="48" cy="7.5" r="3"/><circle cx="58" cy="7.5" r="3"/>
    </g>
  </g>
  <g transform="translate(118 179)">
    <rect x="0" y="0" width="68" height="15" rx="2" fill="#171b1c" stroke="#475054" stroke-width="1"/>
    <g fill="url(#gold)">
      <circle cx="8" cy="7.5" r="3"/><circle cx="18" cy="7.5" r="3"/><circle cx="28" cy="7.5" r="3"/><circle cx="38" cy="7.5" r="3"/><circle cx="48" cy="7.5" r="3"/><circle cx="58" cy="7.5" r="3"/>
    </g>
  </g>

  <!-- Silkscreen -->
  <g fill="none" stroke="#e9f0ed" stroke-width="1" opacity="0.78">
    <path d="M34 33 h13 v8"/><path d="M257 33 h13 v8"/><path d="M34 191 h13 v-8"/><path d="M257 191 h13 v-8"/>
    <rect x="50" y="82" width="34" height="38" rx="2"/>
    <rect x="220" y="87" width="36" height="36" rx="2"/>
    <path d="M112 47 h80" opacity="0.5"/>
    <path d="M112 175 h80" opacity="0.5"/>
  </g>
  <g fill="#edf4f1" font-family="Arial,Helvetica,sans-serif" font-size="5.6" opacity="0.8">
    <text x="39" y="54">L1</text><text x="57" y="125">U3</text><text x="228" y="128">U7</text>
    <text x="45" y="158">R12</text><text x="248" y="169">C19</text><text x="119" y="28">J1</text><text x="119" y="205">J2</text>
    <text x="286" y="113" transform="rotate(90 286 113)">REV A</text>
  </g>

  <!-- Tiny fiducials -->
  <g>
    <circle cx="103" cy="39" r="2.4" fill="#d3b04c"/><circle cx="103" cy="39" r="0.85" fill="#0a271f"/>
    <circle cx="201" cy="185" r="2.4" fill="#d3b04c"/><circle cx="201" cy="185" r="0.85" fill="#0a271f"/>
  </g>
</svg>
